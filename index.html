body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#166534,#facc15);min-height:100vh}
#map{height:480px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.7)}
.leaflet-popup-content{font-family:Arial,sans-serif}
.etape-icon{background:#facc15;border:3px solid #fff;border-radius:50%;color:#111827;font-weight:700;text-align:center;line-height:28px;box-shadow:0 2px 8px rgba(0,0,0,.35)}

<div class="max-w-5xl mx-auto p-4">
<h1 class="text-4xl font-bold text-center">Balade audio de Saint-Germain-en-Brionnais</h1>
<p class="text-center mb-4">Découvrez Saint-Germain-en-Brionnais au fil d'une balade audio.</p>
<div id="map"></div>
<div id="etapes" class="grid md:grid-cols-2 gap-4 mt-5"></div>

const plan=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const relief=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
  maxZoom:17,
  attribution:'Carte: &copy; OpenStreetMap, SRTM | &copy; OpenTopoMap'
});

L.control.layers({'Plan':plan,'Relief':relief},null,{position:'topright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);

// Tracé intégré directement dans la page : il s'affiche même si le navigateur
// bloque le chargement local du fichier GPX.
const traceParcours=L.polyline(parcoursCoords,{
  color:'#dc2626',
  weight:6,
  opacity:1,
  lineJoin:'round',
  lineCap:'round'
}).addTo(map);

map.fitBounds(traceParcours.getBounds(),{padding:[25,25]});

// Les coordonnées ci-dessous proviennent des points d'intérêt du GPX fourni.
// Placez les MP3 dans le dossier "audio" avec les noms Audio1.mp3, Audio2.mp3, etc.
const etapesData=[
 {titre:"1. Le débeurdinoir",texte:"",fichier:"Audio1.mp3",coords:[46.350247,4.260226]},

];

const conteneur=document.getElementById('etapes');
etapesData.forEach(e=>{
 const carte=document.createElement('div');
 carte.className='bg-white text-black rounded-lg p-4 shadow';
 carte.innerHTML=`<h2 class="text-xl font-bold">${e.titre}</h2>${e.texte?`<p>${e.texte}</p>`:''}<audio controls preload="none" class="w-full mt-3"><source src="audio/${e.fichier}" type="audio/mpeg">Votre navigateur ne supporte pas l'audio.</audio><button class="mt-3 bg-yellow-400 hover:bg-yellow-300 px-3 py-2 rounded font-semibold">Voir sur la carte</button>`;
 conteneur.appendChild(carte);
 const numero=e.titre.split('.')[0];
 const icon=L.divIcon({className:'',html:`<div class="etape-icon">${numero}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-18]});
 const marker=L.marker(e.coords,{icon,title:e.titre}).addTo(map).bindPopup(`<strong>${e.titre}</strong>`);
 carte.querySelector('button').onclick=()=>{map.flyTo(marker.getLatLng(),17,{duration:0.8});marker.openPopup();};
});
